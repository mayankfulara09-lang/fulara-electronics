let cart=[];
let reviewsData={};
let currentProduct=null;
let currentRating=0;

function render(list){
let html='';
list.forEach(p=>{
html+=`<div class='card' onclick='openProduct(${p.id})'>
<img src='${p.image}'>
<h4>${p.name}</h4>
<p>₹${p.price}</p>
<button onclick='event.stopPropagation();add(${p.id})'>Add</button>
</div>`;
});
document.getElementById('products').innerHTML=html;
}

function searchProduct(){
let val=search.value.toLowerCase();
render(products.filter(p=>p.name.toLowerCase().includes(val)));
}

function openProduct(id){
currentProduct=id;
let p=products.find(x=>x.id==id);
pName.innerText=p.name;
pDesc.innerText=p.desc;
modal.style.display='flex';
loadRating();
showReviews();
}

function loadRating(){
rating.innerHTML='';
for(let i=1;i<=5;i++){
let s=document.createElement('span');
s.innerText='★';
s.onclick=()=>setRating(i);
s.id='star'+i;
rating.appendChild(s);
}
}

function setRating(r){
currentRating=r;
for(let i=1;i<=5;i++){
document.getElementById('star'+i).classList.toggle('active',i<=r);
}
}

function saveReview(){
let fb=feedback.value;
if(!reviewsData[currentProduct])reviewsData[currentProduct]=[];
reviewsData[currentProduct].push({rating:currentRating,text:fb});
showReviews();
feedback.value='';
alert('Review Saved');
}

function showReviews(){
let list=reviewsData[currentProduct]||[];
let html='';
list.forEach(r=>{
html+=`⭐${r.rating} - ${r.text}<br>`;
});
document.getElementById('reviews').innerHTML=html;
}

function add(id){
let item=cart.find(i=>i.id==id);
if(item)item.qty++; else{let p=products.find(p=>p.id==id);cart.push({...p,qty:1});}
update();
}
function update(){

    let html = '';
    let subtotal = 0;

    cart.forEach(i=>{
        subtotal += i.price * i.qty;

        html += `
        ${i.name} ₹${i.price} x ${i.qty}<br>
        <button class='qtyBtn' onclick='change(${i.id},-1)'>-</button>
        ${i.qty}
        <button class='qtyBtn' onclick='change(${i.id},1)'>+</button>
        <hr>`;
    });

    let delivery = document.getElementById('delivery').value;
    let charge = 0;

    if(delivery === 'home'){
        if(subtotal >= 1000){
            charge = 0;
        } else {
            charge = 80;
        }
    }

    let total = subtotal + charge;

    html += `<b>Subtotal: ₹${subtotal}</b><br>`;
    html += `<b>Delivery Charge: ₹${charge}</b><br>`;

    document.getElementById('cartItems').innerHTML = html;
    document.getElementById('total').innerText = 'Total: ₹' + total;
}
function change(id,val){
let item=cart.find(i=>i.id==id);
item.qty+=val;
if(item.qty<=0)cart=cart.filter(i=>i.id!=id);
update();
}

function toggleCart(){cartBox.classList.toggle('active');}

document.getElementById('payment').addEventListener('change',function(){
qr.style.display=this.value=='ONLINE'?'block':'none';
});

function placeOrder(){
if(cart.length==0){alert('Cart empty');return}

let name=prompt('Enter Name');
let phone=prompt('Enter Phone');
let address=prompt('Enter Address');

let payment=document.getElementById('payment').value;
if(payment=='ONLINE'){
let file=document.getElementById('screenshot').files[0];
if(!file){alert('Upload payment screenshot');return}
}

let msg='Fulara Electronics Order\n\n';
msg+=`Name:${name}\nPhone:${phone}\nAddress:${address}\n\n`;
let total=0;
cart.forEach(i=>{total+=i.price*i.qty;msg+=`${i.name} ₹${i.price} x ${i.qty} = ₹${i.price*i.qty}\n`});
msg+=`\nTotal: ₹${total}`;

emailjs.send("service_qip4z51","template_jd8xtmm",{name:name,phone:phone,address:address,message:msg});
window.open('https://wa.me/919891361264?text='+encodeURIComponent(msg));

const { jsPDF } = window.jspdf;
const doc = new jsPDF();
doc.text("FULARA ELECTRONICS BILL",20,10);
doc.text(msg,10,20);
doc.save("bill.pdf");

cart=[];update();
}

window.onclick=e=>{if(e.target==modal)modal.style.display='none'};

render(products);
document.getElementById('delivery').addEventListener('change', update);
</script>
